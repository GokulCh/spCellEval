# configs/benchmark.yaml
# Stage 3 — unified benchmark runner configuration

defaults:
  kfold_method: StratifiedKFold
  # Supervised methods are benchmarked with both strategies by default.
  kfold_methods:
    - StratifiedKFold
    - ProgressiveKFold
  granularity: level3
  phenotype_column: cell_type
  batch_column: batch_id
  strip_labels: true
  n_splits: 5
  # Cell types below rare_fraction (1%) are labelled "rare" for benchmarking.
  rare_fraction: 0.01
  # Cell types at or above common_fraction (5%) are labelled "common".
  common_fraction: 0.05
  # 0 = auto-detect CPU workers for benchmark/spatial/evaluation stages.
  parallel_jobs: 0
  spatial_smooth: false
  spatial_k_neighbors: 15
  # Tabular methods that run without expert labels (prior-knowledge + clustering)
  unlabeled_methods:
    - signature
    - scyan
    - leiden
    - louvain
    - spade
  pipeline:
    strip_labels: true
    pseudo_label: false
    pseudo_label_method: signature
    graph_method: both

datasets:

  IMMUcan:
    config: configs/immucan.yaml
    image_data_dir: data/raw/IMMUcan
    artifacts:
      decision_matrix_scyan: configs/artifacts/IMMUcan/scyan_decision_matrix_level3.csv
      decision_matrix_tacit: configs/artifacts/IMMUcan/tacit_decision_matrix_level3.csv
      decision_matrix_astir: src/methods/astir/cell_types_IMMUcan.yml
      celllens_script: src/methods/CellLens/IMMUcan_LITE_CellLENS.py
    methods:
      - random_forest
      - xgboost
      - logistic_regression
      - singler
      - scarches
      - leiden
      - louvain
      - spade
      - flowsom
      - phenograph
      - signature
      - scyan
      - tacit
      - astir
      - cellsighter
      - stellar
      - virtues_supervised

  CRC_TMA:
    config: configs/crc_tma.yaml
    batch_column: batch_id
    image_data_dir: data/raw/CRC_TMA
    artifacts:
      decision_matrix_scyan: configs/artifacts/CRC_TMA/scyan_decision_matrix_level3.csv
      decision_matrix_tacit: configs/artifacts/CRC_TMA/tacit_decision_matrix_level3.csv
      decision_matrix_astir: src/methods/astir/cell_types_CRC_TMA.yml
    methods:
      - random_forest
      - xgboost
      - logistic_regression
      - singler
      - scarches
      - leiden
      - louvain
      - spade
      - flowsom
      - phenograph
      - signature
      - scyan
      - tacit
      - astir
      - cellsighter
      - stellar
