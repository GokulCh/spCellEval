name: spCellEval
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core scientific stack
  - python=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3

  # YAML parsing (required by run_preprocess.py)
  - pyyaml>=6.0

  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.13

  # Jupyter
  - jupyterlab>=4.0
  - ipykernel

  # Progress bars
  - tqdm>=4.65

  # Optional: AnnData for future h5ad support
  - anndata>=0.10

  # Pip-only packages
  - pip:
      - scanpy>=1.9

# To create:  conda env create -f environment.yml
# To activate: conda activate spCellEval
# To update:   conda env update -f environment.yml --prune
